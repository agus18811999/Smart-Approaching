<body class="flex items-center justify-center min-h-screen p-4 sm:p-6 select-none relative overflow-x-hidden">

    <!-- Ambient Dynamic Background Orbs -->

    <!-- MAIN CARD CONTAINER -->

        <!-- HEADER & BADGE -->

        <!-- ==================== 1. FORM LOGIN ==================== -->
        <form id="loginForm" onsubmit="submitLogin(event)" class="space-y-4">
            <div>
                <label class="block text-[10px] uppercase font-bold tracking-[0.18em] text-slate-400 mb-1.5 pl-1">Email Akun</label>
                <div class="relative group">

           <div>

    <i class="fa fa-eye text-xs"></i>
</button>

            <button type="submit" id="loginSubmitBtn" class="w-full py-3.5 mt-2 rounded-2xl bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:from-indigo-500 hover:to-pink-500 text-white font-extrabold text-xs uppercase tracking-widest shadow-[0_10px_25px_rgba(99,102,241,0.35)] hover:scale-[1.01] active:scale-[0.99] transition-all duration-300 flex items-center justify-center gap-2">

        <!-- ==================== 2. FORM REGISTER ==================== -->

                    <input type="text" id="regName" required class="custom-input w-full pl-11 pr-4 py-3 rounded-2xl text-xs sm:text-sm font-medium placeholder:text-slate-500" placeholder="Nama Anda atau Brand">

                    <i class="fa fa-envelope absolute left-4 top-4 text-slate-500 text-xs group-focus-within:text-pink-400 transition-colors"></i>
                    <input type="email" id="regEmail" required class="custom-input w-full pl-11 pr-4 py-3 rounded-2xl text-xs sm:text-sm font-medium placeholder:text-slate-500" placeholder="nama@email.com">

                    <i class="fa fa-lock absolute left-4 top-4 text-slate-500 text-xs group-focus-within:text-pink-400 transition-colors"></i>
                    <input type="password" id="regPassword" minlength="6" required class="custom-input w-full pl-11 pr-11 py-3 rounded-2xl text-xs sm:text-sm font-medium placeholder:text-slate-500" placeholder="Minimal 6 karakter">
                    <!-- Tombol Mata -->
                    <button type="button" onclick="togglePasswordVisibility('regPassword', this)" class="absolute right-3.5 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center text-slate-400 hover:text-white transition rounded-xl hover:bg-white/5" aria-label="Toggle password">
    <i class="fa fa-eye text-xs"></i>
</button>
                </div>
            </div>

            <button type="submit" id="regSubmitBtn" class="w-full py-3.5 mt-2 rounded-2xl bg-gradient-to-r from-pink-600 via-rose-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white font-extrabold text-xs uppercase tracking-widest shadow-[0_10px_25px_rgba(244,63,94,0.35)] hover:scale-[1.01] active:scale-[0.99] transition-all duration-300 flex items-center justify-center gap-2">
                <span>Buat Akun Baru</span>

            <div class="pt-4 border-t border-white/5 text-center">

            </div>

        <!-- ==================== 3. FORM FORGOT PASSWORD ==================== -->
        <div id="forgotForm" class="space-y-4 hidden">
            
            <!-- Step 1: Request OTP -->

                    <i class="fa fa-info-circle mr-1 text-indigo-400"></i> Masukkan email akun Anda. Sistem akan mengirim 6-digit kode verifikasi reset kata sandi ke kotak masuk Anda.
                </div>
                
                <div>
                    <label class="block text-[10px] uppercase font-bold tracking-[0.18em] text-slate-400 mb-1.5 pl-1">Email Terdaftar</label>
                    <div class="relative">
                        <i class="fa fa-envelope absolute left-4 top-4 text-slate-500 text-xs"></i>
                        <input type="email" id="forgotEmail" class="custom-input w-full pl-11 pr-4 py-3 rounded-2xl text-xs sm:text-sm font-medium placeholder:text-slate-500" placeholder="nama@email.com">
                    </div>
                </div>

                <button type="button" onclick="submitRequestOtp()" id="otpBtn" class="w-full py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-xs uppercase tracking-widest shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-2">
                    <span>Kirim Kode OTP</span>

            <!-- Step 2: Confirm OTP & Change Password -->
            <div id="forgotStep2" class="hidden space-y-4">
                <div>
                    <label class="block text-[10px] uppercase font-bold tracking-[0.18em] text-slate-400 mb-1.5 pl-1">Kode OTP (6 Digit)</label>
                    <input type="text" id="resetOtp" maxlength="6" class="custom-input w-full px-4 py-3 rounded-2xl text-base font-mono font-bold tracking-[0.4em] text-center text-amber-300 placeholder:text-slate-600" placeholder="123456">
                </div>

               <div>
                    <label class="block text-[10px] uppercase font-bold tracking-[0.18em] text-slate-400 mb-1.5 pl-1">Password Baru (Min. 6 Karakter)</label>
                    <div class="relative group">
                        <i class="fa fa-lock absolute left-4 top-4 text-slate-500 text-xs group-focus-within:text-emerald-400 transition-colors"></i>
                        <input type="password" id="resetNewPass" minlength="6" class="custom-input w-full pl-11 pr-11 py-3 rounded-2xl text-xs sm:text-sm font-medium placeholder:text-slate-500" placeholder="••••••••">
                        <!-- Tombol Mata -->
                        <button type="button" onclick="togglePasswordVisibility('resetNewPass', this)" class="absolute right-3.5 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center text-slate-400 hover:text-white transition rounded-xl hover:bg-white/5" aria-label="Toggle password">
    <i class="fa fa-eye text-xs"></i>
</button>
                    </div>
                </div>

                <button type="button" onclick="submitResetPassword()" id="resetSubmitBtn" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-extrabold text-xs uppercase tracking-widest shadow-lg shadow-emerald-600/30 transition-all flex items-center justify-center gap-2">
                    <span>Simpan Password Baru</span>
                    <i class="fa fa-check text-xs"></i>
                </button>
            </div>

            <div class="text-center pt-2">
                <button type="button" onclick="switchView('login')" class="text-xs text-slate-400 hover:text-white transition inline-flex items-center gap-1.5">
                    <i class="fa fa-arrow-left text-[10px]"></i> Kembali ke Form Login
                </button>
            </div>
        </div>
        <!-- ==================== ASTRA INFINITA FOOTER ==================== -->
        <div class="mt-6 pt-4 border-t border-white/5 text-center select-none">
            <p class="text-[11px] sm:text-xs text-slate-500 font-medium tracking-wide flex items-center justify-center gap-1.5">
                <span>Part of</span>
                <a href="https://astrainfinita.vercel.app/" target="_blank" rel="noopener noreferrer" 
                   class="group inline-flex items-center gap-1 font-bold bg-gradient-to-r from-indigo-300 via-purple-300 to-pink-300 bg-clip-text text-transparent hover:brightness-125 transition-all duration-300">
                    <span>Astra Infinita</span>
                    <i class="fa fa-arrow-up-right-from-square text-[9px] text-pink-400 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform"></i>
                </a>
            </p>
        </div>

    <!-- SCRIPT CLIENT LOGIC -->
    <script>
        // TEMPELKAN URL APPS SCRIPT ANDA DI SINI
        const BACKEND_URL = "https://script.google.com/macros/s/AKfycbzEWW13BINaSMlza-M-A7OjZl0rr1XqYMCWkziWkBp2oCgaft1s9nkuQtQ8VttQ1uIn/exec";

        // Cek sesi aktif, jika ada langsung arahkan ke dashboard
        if (localStorage.getItem('sa_token')) {
            window.location.href = 'main.html';
        }

        // FUNGSI NOTIFIKASI MEWAH (Dipanggil Hanya Setelah Loading Selesai)
        function showNotification(type, title, message) {
            const el = document.getElementById('notifyBox');
            const icon = document.getElementById('notifyIcon');
            const titleEl = document.getElementById('notifyTitle');
            const msgEl = document.getElementById('notifyMsg');

            if (type === 'success') {
                el.className = "mb-6 p-4 rounded-2xl text-xs font-semibold leading-relaxed border bg-emerald-500/15 border-emerald-500/30 text-emerald-300 shadow-[0_0_25px_rgba(16,185,129,0.2)] animate-notify";
                icon.className = "fa fa-circle-check text-base text-emerald-400";
            } else {
                el.className = "mb-6 p-4 rounded-2xl text-xs font-semibold leading-relaxed border bg-rose-500/15 border-rose-500/30 text-rose-300 shadow-[0_0_25px_rgba(244,63,94,0.2)] animate-notify";
                icon.className = "fa fa-circle-xmark text-base text-rose-400";
            }

            titleEl.textContent = title;
            msgEl.textContent = message;
            el.classList.remove('hidden');
        }

        function clearNotification() {
            document.getElementById('notifyBox').classList.add('hidden');
        }

        function switchView(view) {
            clearNotification();
            document.getElementById('loginForm').classList.toggle('hidden', view !== 'login');
            document.getElementById('registerForm').classList.toggle('hidden', view !== 'register');
            document.getElementById('forgotForm').classList.toggle('hidden', view !== 'forgot');

            const subHeader = document.getElementById('portalSubHeader');
            if (view === 'login') subHeader.textContent = "Masuk untuk mengelola pipeline outreach Anda";
            else if (view === 'register') subHeader.textContent = "Registrasi akun baru untuk personalisasi data";
            else if (view === 'forgot') {
                subHeader.textContent = "Pemulihan kata sandi akun";
                document.getElementById('forgotStep1').classList.remove('hidden');
                document.getElementById('forgotStep2').classList.add('hidden');
            }
        }

        async function callApi(action, payload = {}) {
            const response = await fetch(BACKEND_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: action, payload: payload })
            });
            return await response.json();
        }

        // ==================== SUBMIT LOGIN ====================
        async function submitLogin(e) {
            e.preventDefault();
            clearNotification();

            const btn = document.getElementById('loginSubmitBtn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            // Efek Loading Dinamis
            btn.innerHTML = `<i class="fa fa-spinner fa-spin text-sm"></i><span>Memverifikasi Akun...</span>`;

            try {
                const res = await callApi('login', {
                    email: document.getElementById('loginEmail').value,
                    password: document.getElementById('loginPassword').value
                });

                // Loading Berhenti
                btn.disabled = false;
                btn.innerHTML = originalText;

                // Notifikasi Muncul Setelah Loading
                if (res.success) {
                    localStorage.setItem('sa_token', res.token);
                    localStorage.setItem('sa_user', JSON.stringify(res.user));
                    showNotification('success', 'Autentikasi Berhasil', 'Login berhasil! Sedang mengalihkan ke dashboard...');
                    setTimeout(() => window.location.href = 'main.html', 1400);
                } else {
                    showNotification('error', 'Gagal Masuk', res.message || 'Kombinasi email dan password salah.');
                }
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = originalText;
                showNotification('error', 'Koneksi Terputus', 'Gagal tersambung ke server Google Apps Script.');
            }
        }
        // FUNGSI TOGGLE LIHAT PASSWORD
function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('i');
    
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
        icon.classList.add('text-indigo-400');
    } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.remove('text-indigo-400');
        icon.classList.add('fa-eye');
    }
}

        // ==================== SUBMIT REGISTER ====================
        async function submitRegister(e) {
            e.preventDefault();
            clearNotification();

            const nameVal = document.getElementById('regName').value.trim();
            const emailVal = document.getElementById('regEmail').value.trim();
            const passVal = document.getElementById('regPassword').value;

            const btn = document.getElementById('regSubmitBtn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            // Efek Loading Dinamis
            btn.innerHTML = `<i class="fa fa-spinner fa-spin text-sm"></i><span>Mendaftarkan Profil...</span>`;

            try {
                const res = await callApi('register', {
                    name: nameVal,
                    email: emailVal,
                    password: passVal
                });

                // Loading Berhenti
                btn.disabled = false;
                btn.innerHTML = originalText;

                // Notifikasi Muncul Setelah Loading
                if (res.success) {
                    // SESUAI REQUEST: JANGAN LANGSUNG MASUK, ARAHKAN KE LOGIN + ISI DATA OTOMATIS
                    switchView('login');
                    document.getElementById('loginEmail').value = emailVal;
                    document.getElementById('loginPassword').value = passVal;

                    showNotification('success', 'Registrasi Berhasil', 'Akun Anda telah aktif! Data login telah diisikan otomatis. Silakan klik "Masuk ke Dashboard".');
                } else {
                    showNotification('error', 'Registrasi Gagal', res.message || 'Email mungkin sudah terdaftar sebelumnya.');
                }
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = originalText;
                showNotification('error', 'Sistem Sibuk', 'Terjadi gangguan saat mendaftarkan akun.');
            }
        }

        // ==================== FORGOT PASSWORD: REQUEST OTP ====================
        async function submitRequestOtp() {
            clearNotification();
            const email = document.getElementById('forgotEmail').value.trim();
            if (!email) { 
                showNotification('error', 'Data Kurang', 'Harap masukkan email akun Anda.'); 
                return; 
            }

            const btn = document.getElementById('otpBtn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<i class="fa fa-spinner fa-spin text-sm"></i><span>Mengirim Kode OTP...</span>`;

            try {
                const res = await callApi('forgot_password', { email: email });

                btn.disabled = false;
                btn.innerHTML = originalText;

                if (res.success) {
                    showNotification('success', 'OTP Terkirim', res.message || 'Silakan periksa kotak masuk email Anda.');
                    document.getElementById('forgotStep1').classList.add('hidden');
                    document.getElementById('forgotStep2').classList.remove('hidden');
                } else {
                    showNotification('error', 'Permintaan Ditolak', res.message || 'Email tidak ditemukan di database.');
                }
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = originalText;
                showNotification('error', 'Gagal Mengirim', 'Pastikan koneksi internet aktif.');
            }
        }

        // ==================== FORGOT PASSWORD: RESET PASSWORD ====================
        async function submitResetPassword() {
            clearNotification();
            const email = document.getElementById('forgotEmail').value.trim();
            const otp = document.getElementById('resetOtp').value.trim();
            const newPassword = document.getElementById('resetNewPass').value;

            if (!otp || newPassword.length < 6) {
                showNotification('error', 'Format Tidak Sesuai', 'Lengkapi 6 digit OTP dan password baru minimal 6 karakter.');
                return;
            }

            const btn = document.getElementById('resetSubmitBtn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<i class="fa fa-spinner fa-spin text-sm"></i><span>Menyimpan Password...</span>`;

            try {
                const res = await callApi('reset_password', {
                    email: email,
                    otp: otp,
                    newPassword: newPassword
                });

                btn.disabled = false;
                btn.innerHTML = originalText;

                if (res.success) {
                    showNotification('success', 'Reset Berhasil', 'Kata sandi berhasil diperbarui! Silakan masuk dengan kata sandi baru Anda.');
                    setTimeout(() => {
                        switchView('login');
                        document.getElementById('loginEmail').value = email;
                        document.getElementById('loginPassword').value = newPassword;
                    }, 1800);
                } else {
                    showNotification('error', 'Verifikasi Gagal', res.message || 'Kode OTP salah atau telah kedaluwarsa.');
                }
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = originalText;
                showNotification('error', 'Terjadi Masalah', 'Gagal memproses kata sandi baru.');
            }
        }
    </script>
</body>
